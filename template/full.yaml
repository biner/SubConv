CUSTOM_PROXY_GROUP:
- name: ☑️ 手动切换
  type: select
  manual: true
  rule: false
- name: ♻️ 自动选择
  type: url-test
  rule: false
- name: 📶 官方优选
  type: load-balance
  rule: false
  regex: (官方|防|电信|联通|移动|CT|CU|CM|CF|t\.me|WARP|Warp|warp)
- name: 🇭🇰 香港节点
  type: url-test
  rule: false
  regex: (?i:\b(?:HK|HKG)\d*\b|Hong.*?Kong|\bHKT\b|\bHKBN\b|\bHGC\b|\bWTT\b|\bCMI\b|[^-]港)
- name: 🇹🇼 台湾节点
  type: url-test
  rule: false
  regex: (?i:\b(?:TW|TWN)\d*\b|Taiwan|新北|彰化|\bCHT\b|台湾|[^-]台|\bHINET\b)
- name: 🇸🇬 狮城节点
